<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(170 0.5 0.5)">
      <stop offset="0%" stop-color="#120f1e"/>
      <stop offset="55%" stop-color="#2c2250"/>
      <stop offset="100%" stop-color="#5b4a8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#g)"/>
  <rect width="1080" height="1440" fill="url(#glow)"/>
  <rect width="1080" height="1440" filter="url(#noise)" opacity="0.6" fill="none"/>
</svg>